<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyVault — Sign In</title>
  <meta name="description" content="Sign in to StudyVault engineering study portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FAFAFA;
      --bg-2: #FFFFFF;
      --text-1: #0A0A0A;
      --text-2: #555555;
      --text-3: #888888;
      --text-inv: #FFFFFF;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,0,0,0.15);
      --accent: #2563EB;
      --accent-g: rgba(37,99,235,0.2);
      --accent-d: rgba(37,99,235,0.1);
      --success: #16a34a;
      --error: #dc2626;
      --r: 16px;
      --ease: cubic-bezier(0.4,0,0.2,1);
      --spring: cubic-bezier(0.34,1.56,0.64,1);
    }
    *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Background ── */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 60% at 20% 50%, rgba(37,99,235,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 50%, rgba(37,99,235,0.03) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 100%, rgba(37,99,235,0.04) 0%, transparent 50%);
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
    }
    .particles-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Card ── */
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }

    .login-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 44px 40px;
      box-shadow:
        0 20px 40px rgba(0,0,0,0.05),
        0 1px 3px rgba(0,0,0,0.05);
      animation: cardIn 0.5s var(--spring) forwards;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(20px) scale(0.97); }
      to   { opacity:1; transform: translateY(0)    scale(1);    }
    }

    /* ── Brand ── */
    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 36px;
      gap: 12px;
    }
    .brand-icon {
      width: 56px; height: 56px;
      border-radius: 16px;
      background: var(--accent-d);
      border: 1px solid rgba(37,99,235,0.15);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent);
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-1);
    }
    .brand-name span { color: var(--accent); }
    .brand-sub {
      font-size: 0.85rem;
      color: var(--text-3);
      margin-top: -4px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 8px;
    }
    .input-wrap {
      position: relative;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      pointer-events: none;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-1);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-d);
      background: var(--bg-2);
    }
    input::placeholder { color: var(--text-3); }

    /* Password toggle */
    .pw-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-3); cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .pw-toggle:hover { color: var(--text-1); }

    /* ── Submit ── */
    .btn-login {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent);
      color: var(--text-inv);
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px var(--accent-g);
      font-family: inherit;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px var(--accent-g);
    }
    .btn-login:active { transform: scale(0.97); }
    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: var(--text-inv);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: block; }
    .btn-login.loading .btn-text { display: none; }

    /* ── Error / success ── */
    .alert {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-top: 16px;
      line-height: 1.5;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .alert.error {
      display: flex;
      gap: 8px;
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.2);
      color: var(--error);
    }
    .alert.success {
      display: flex;
      gap: 8px;
      background: rgba(22,163,74,0.1);
      border: 1px solid rgba(22,163,74,0.2);
      color: var(--success);
    }
    .alert.hidden { display: none !important; }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-3);
      font-size: 0.75rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Footer note ── */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--text-3);
      line-height: 1.6;
    }
    .login-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover { text-decoration: underline; }

    /* ── Particles ── */
    .lp { position: fixed; border-radius: 50%; background: var(--accent); animation: lpFloat linear infinite; opacity: 0; }
    @keyframes lpFloat {
      0%   { transform: translateY(100vh); opacity: 0; }
      10%  { opacity: 0.3; }
      90%  { opacity: 0.1; }
      100% { transform: translateY(-100px) translateX(var(--drift)); opacity: 0; }
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; border-radius: 20px; box-shadow: none; border: none; background: transparent; }
      .login-wrap { max-width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
      body { background: var(--bg-2); }
    }
  </style>
</head>
<body>

  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="particles-bg" aria-hidden="true" id="login-particles"></div>

  <div class="login-wrap">
    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <div class="brand-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M2 17l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-name">Study<span>Vault</span></div>
        <div class="brand-sub">Engineering Learning Portal</div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email-input">Email Address</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M20 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V6a2 2 0 00-2-2z" stroke="currentColor" stroke-width="1.8"/>
              <path d="M22 6l-10 7L2 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input
              type="email"
              id="email-input"
              placeholder="your@email.com"
              autocomplete="email"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="password-input">Password</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
              <path d="M7 11V7a5 5 0 0110 0v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <input
              type="password"
              id="password-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Toggle password visibility">
              <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
              </svg>
              <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error/Success alert -->
        <div class="alert hidden" id="login-alert" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn-login" id="login-btn">
          <div class="spinner" id="login-spinner"></div>
          <span class="btn-text" id="btn-text-main">Sign In to StudyVault</span>
        </button>
      </form>

      <div class="login-footer">
        <p id="toggle-text">Don't have an account? <a href="#" id="toggle-mode">Sign Up</a></p>
      </div>

    </div>
  </div>

  <script type="module">
    import { supabase, signIn, signUp, getCurrentUser } from './supabase.js';

    let isSignUp = false;

    /* ── If already logged in, redirect to main app ── */
    getCurrentUser().then(user => {
      if (user) window.location.href = 'index.html';
    });

    /* ── Particles ── */
    const pc = document.getElementById('login-particles');
    for (let i = 0; i < 20; i++) {
      const p = document.createElement('div');
      p.className = 'lp';
      const size  = Math.random() * 3 + 2;
      const drift = (Math.random() - 0.5) * 200 + 'px';
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        bottom:-10px;
        animation-duration:${Math.random()*14+10}s;
        animation-delay:${Math.random()*10}s;
        --drift:${drift};
        opacity:0;
      `;
      pc.appendChild(p);
    }

    /* ── Password toggle ── */
    const pwInput  = document.getElementById('password-input');
    const pwToggle = document.getElementById('pw-toggle');
    const eyeOpen  = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');
    pwToggle.addEventListener('click', () => {
      const visible = pwInput.type === 'text';
      pwInput.type  = visible ? 'password' : 'text';
      eyeOpen.style.display   = visible ? '' : 'none';
      eyeClosed.style.display = visible ? 'none' : '';
    });

    /* ── Toggle Mode ── */
    const toggleText = document.getElementById('toggle-text');
    const btnText    = document.getElementById('btn-text-main');
    
    // Use event delegation on the container
    toggleText.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') {
        e.preventDefault();
        isSignUp = !isSignUp;
        if (isSignUp) {
          btnText.textContent = 'Sign Up for StudyVault';
          toggleText.innerHTML = 'Already have an account? <a href="#" id="toggle-mode">Sign In</a>';
        } else {
          btnText.textContent = 'Sign In to StudyVault';
          toggleText.innerHTML = 'Don\'t have an account? <a href="#" id="toggle-mode">Sign Up</a>';
        }
        hideAlert();
      }
    });

    /* ── Form submit ── */
    const form      = document.getElementById('login-form');
    const loginBtn  = document.getElementById('login-btn');
    const alertBox  = document.getElementById('login-alert');

    function showAlert(msg, type = 'error') {
      alertBox.className = `alert ${type}`;
      alertBox.textContent = msg;
    }
    function hideAlert() {
      alertBox.className = 'alert hidden';
    }
    function setLoading(on) {
      loginBtn.disabled = on;
      loginBtn.classList.toggle('loading', on);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;

      if (!email || !password) {
        showAlert('Please enter both email and password.');
        return;
      }

      setLoading(true);
      
      let res;
      if (isSignUp) {
        res = await signUp(email, password);
      } else {
        res = await signIn(email, password);
      }
      
      setLoading(false);

      if (res.error) {
        showAlert(res.error.message || 'An error occurred. Please try again.');
        return;
      }

      if (isSignUp) {
        // If confirm email is required, data.user is returned but session is null
        if (res.data.user && !res.data.session) {
          showAlert('Account created! Please check your email to verify.', 'success');
        } else {
          showAlert('Account created! Redirecting...', 'success');
          setTimeout(() => { window.location.href = 'index.html'; }, 800);
        }
      } else {
        showAlert('Signed in! Redirecting...', 'success');
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      }
    });
  </script>
</body>
</html>
